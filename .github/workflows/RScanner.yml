name: Neural Bridge Scanner - Autonomous Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
# 🧬 AUTONOMOUS CYBER-ORGANISM PIPELINE
# ═══════════════════════════════════════════════════════════════════════════════
# Purpose: Scan network assets and sync directly to Cloudflare D1 via secure API
# No file storage - Direct database injection architecture
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan to perform'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - targeted
      operator_filter:
        description: 'Filter by operator (optional)'
        required: false
        type: string
      enable_notifications:
        description: 'Send notifications'
        required: false
        default: false
        type: boolean
  schedule:
    # Run every 6 hours for continuous intelligence gathering
    - cron: '0 */6 * * *'

env:
  RUST_BACKTRACE: 1
  SCANNER_VERSION: "2.0.0-NEURAL"

jobs:
  neural-scan-and-sync:
    runs-on: ubuntu-latest
    name: Neural Asset Discovery & Bridge Sync
    timeout-minutes: 60
    
    steps:
      # ═══════════════════════════════════════════════════════════════════════
      # 📦 ENVIRONMENT SETUP
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🦀 Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: 💾 Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: neural-scanner-v2
      
      - name: 📊 Display Scan Configuration
        run: |
          echo "╔═══════════════════════════════════════════════════════════════╗"
          echo "║          NEURAL BRIDGE SCANNER - AUTONOMOUS MODE              ║"
          echo "╚═══════════════════════════════════════════════════════════════╝"
          echo "🕐 Scan Time: $(TZ='UTC' date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🎯 Scan Type: ${{ github.event.inputs.scan_type || 'scheduled' }}"
          echo "📡 Target: Direct D1 Database Injection"
          echo "🔐 Security: Bridge Secret Authentication"
          echo "╚═══════════════════════════════════════════════════════════════╝"
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🔨 BUILD SCANNER
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🔨 Build Rust Scanner (Release Mode)
        run: |
          echo "🔨 Building scanner with optimizations..."
          cargo build --release
          echo "✅ Build complete"
      
      - name: 🔐 Set Execute Permissions
        run: |
          chmod +x ./target/release/RScanner
          ls -lh ./target/release/RScanner
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🔍 EXECUTE SCAN
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🔍 Execute Network Scan
        id: scan
        run: |
          echo "🔍 Starting network asset discovery..."
          
          # Execute scanner and capture output
          ./target/release/RScanner > scan_results.txt 2>&1
          
          # Display scan summary
          echo "📊 Scan execution completed"
          echo "scan_completed=true" >> $GITHUB_OUTPUT
          
          # Show last 20 lines of results
          echo "═══════════════════════════════════════════════════════════════"
          echo "📋 Scan Results Preview (Last 20 lines):"
          tail -n 20 scan_results.txt
          echo "═══════════════════════════════════════════════════════════════"
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🔄 TRANSFORM & PREPARE DATA
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🔄 Parse & Transform Scan Results
        id: transform
        run: |
          echo "🔄 Parsing scan results and transforming to JSON..."
          
          # Create Python script for parsing
          cat > parse_results.py << 'PYTHON_SCRIPT'
          import re
          import json
          import sys
          from datetime import datetime
          
          def parse_scan_results(file_path):
              assets = []
              
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # Parse PROXY LIVE lines
                  live_pattern = r'PROXY LIVE\s+✅:\s+([\d.]+)\s+\((\d+)\s+ms\)\s+-\s+(.+?)(?:\n|$)'
                  matches = re.findall(live_pattern, content)
                  
                  for match in matches:
                      ip, latency, location = match
                      
                      # Enhanced operator detection from location
                      operator = None
                      location_lower = location.lower()
                      
                      # Detect Iranian operators
                      if any(keyword in location_lower for keyword in ['iran', 'tehran', 'mashhad', 'isfahan', 'shiraz', 'tabriz']):
                          # More sophisticated operator detection
                          if any(city in location_lower for city in ['tehran', 'karaj']):
                              operator = 'MCI'
                          elif any(city in location_lower for city in ['mashhad', 'isfahan']):
                              operator = 'Irancell'
                          elif 'rightel' in location_lower:
                              operator = 'Rightel'
                          else:
                              operator = 'MCI'  # Default fallback
                      
                      asset = {
                          "type": "IP",
                          "value": ip.strip(),
                          "latency": int(latency),
                          "location": location.strip(),
                          "operator": operator,
                          "source": "rust_scanner",
                          "timestamp": datetime.utcnow().isoformat() + "Z"
                      }
                      assets.append(asset)
                  
                  # Remove duplicates based on IP
                  seen = set()
                  unique_assets = []
                  for asset in assets:
                      if asset['value'] not in seen:
                          seen.add(asset['value'])
                          unique_assets.append(asset)
                  
                  return unique_assets
              
              except Exception as e:
                  print(f"Error parsing results: {e}", file=sys.stderr)
                  return []
          
          if __name__ == "__main__":
              assets = parse_scan_results('scan_results.txt')
              
              if assets:
                  # Create payload
                  payload = {
                      "source": "github_actions",
                      "scan_timestamp": datetime.utcnow().isoformat() + "Z",
                      "scan_type": "${{ github.event.inputs.scan_type || 'scheduled' }}",
                      "total_discovered": len(assets),
                      "assets": assets
                  }
                  
                  # Write to file
                  with open('payload.json', 'w') as f:
                      json.dump(payload, f, indent=2)
                  
                  print(f"✅ Successfully parsed {len(assets)} unique assets")
                  print(f"asset_count={len(assets)}")
              else:
                  print("⚠️ No assets found in scan results")
                  # Create empty payload
                  payload = {
                      "source": "github_actions",
                      "scan_timestamp": datetime.utcnow().isoformat() + "Z",
                      "scan_type": "${{ github.event.inputs.scan_type || 'scheduled' }}",
                      "total_discovered": 0,
                      "assets": []
                  }
                  with open('payload.json', 'w') as f:
                      json.dump(payload, f, indent=2)
                  print("asset_count=0")
          PYTHON_SCRIPT
          
          # Execute parser
          python3 parse_results.py > parser_output.txt 2>&1
          cat parser_output.txt
          
          # Extract asset count
          ASSET_COUNT=$(grep "asset_count=" parser_output.txt | cut -d'=' -f2 || echo "0")
          echo "asset_count=$ASSET_COUNT" >> $GITHUB_OUTPUT
          
          # Get payload size
          PAYLOAD_SIZE=$(stat -f%z payload.json 2>/dev/null || stat -c%s payload.json 2>/dev/null || echo "0")
          echo "payload_size=$PAYLOAD_SIZE" >> $GITHUB_OUTPUT
          
          # Display summary
          echo "═══════════════════════════════════════════════════════════════"
          echo "📊 TRANSFORMATION SUMMARY:"
          echo "   📦 Assets Discovered: $ASSET_COUNT"
          echo "   💾 Payload Size: $PAYLOAD_SIZE bytes"
          echo "═══════════════════════════════════════════════════════════════"
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🌉 BRIDGE SYNC TO CLOUDFLARE D1
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🌉 Sync to Cloudflare D1 Database
        id: sync
        if: steps.transform.outputs.asset_count != '0'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          echo "🌉 Initiating bridge sync to D1 database..."
          
          # Validate required secrets
          if [ -z "$WORKER_URL" ]; then
            echo "❌ ERROR: WORKER_URL secret not configured"
            exit 1
          fi
          
          if [ -z "$BRIDGE_SECRET" ]; then
            echo "❌ ERROR: BRIDGE_SECRET secret not configured"
            exit 1
          fi
          
          # Perform sync with intelligent retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            echo "🔄 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            # Execute POST request
            HTTP_RESPONSE=$(curl -w "\n%{http_code}" -s \
              -X POST \
              "${WORKER_URL}/api/v1/bridge/sync" \
              -H "Content-Type: application/json" \
              -H "X-Bridge-Secret: ${BRIDGE_SECRET}" \
              -H "User-Agent: GitHub-Actions-Neural-Scanner/2.0" \
              --data-binary @payload.json \
              --connect-timeout 30 \
              --max-time 120)
            
            # Extract status code and body
            HTTP_BODY=$(echo "$HTTP_RESPONSE" | head -n -1)
            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1)
            
            echo "📊 HTTP Status: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" = "200" ]; then
              SUCCESS=true
              echo "✅ Bridge sync successful!"
              echo "$HTTP_BODY" | jq '.'
              
              # Extract sync results
              INSERTED=$(echo "$HTTP_BODY" | jq -r '.sync_result.assets_inserted // 0')
              UPDATED=$(echo "$HTTP_BODY" | jq -r '.sync_result.assets_updated // 0')
              REJECTED=$(echo "$HTTP_BODY" | jq -r '.sync_result.assets_rejected // 0')
              
              echo "sync_status=success" >> $GITHUB_OUTPUT
              echo "assets_inserted=$INSERTED" >> $GITHUB_OUTPUT
              echo "assets_updated=$UPDATED" >> $GITHUB_OUTPUT
              echo "assets_rejected=$REJECTED" >> $GITHUB_OUTPUT
              
              echo "═══════════════════════════════════════════════════════════════"
              echo "📊 SYNC RESULTS:"
              echo "   ✅ Inserted: $INSERTED"
              echo "   🔄 Updated: $UPDATED"
              echo "   ❌ Rejected: $REJECTED"
              echo "═══════════════════════════════════════════════════════════════"
              
            else
              echo "⚠️ Sync failed with status $HTTP_STATUS"
              echo "Response: $HTTP_BODY"
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                WAIT_TIME=$((RETRY_COUNT * 10))
                echo "⏳ Waiting ${WAIT_TIME}s before retry..."
                sleep $WAIT_TIME
              fi
            fi
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ All sync attempts failed"
            echo "sync_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🩺 POST-SYNC HEALTH CHECK
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🩺 Verify Database Health
        if: steps.sync.outputs.sync_status == 'success'
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          echo "🩺 Checking database health..."
          
          HEALTH_RESPONSE=$(curl -s \
            -X GET \
            "${WORKER_URL}/api/v1/bridge/health" \
            -H "Accept: application/json")
          
          echo "$HEALTH_RESPONSE" | jq '.'
          
          ACTIVE_ASSETS=$(echo "$HEALTH_RESPONSE" | jq -r '.active_assets // 0')
          echo "✅ Active assets in database: $ACTIVE_ASSETS"
      
      # ═══════════════════════════════════════════════════════════════════════
      # 📊 GENERATE WORKFLOW SUMMARY
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 📊 Generate Workflow Summary
        if: always()
        run: |
          echo "# 🧬 Neural Bridge Scanner - Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Scan Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(TZ='UTC' date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Type**: ${{ github.event.inputs.scan_type || 'scheduled' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Scanner Version**: ${SCANNER_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.transform.outputs.asset_count }}" != "" ]; then
            echo "## 🔍 Discovery Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Assets Discovered**: ${{ steps.transform.outputs.asset_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Payload Size**: ${{ steps.transform.outputs.payload_size }} bytes" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.sync.outputs.sync_status }}" = "success" ]; then
            echo "## ✅ Sync Results" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: SUCCESS" >> $GITHUB_STEP_SUMMARY
            echo "- **Assets Inserted**: ${{ steps.sync.outputs.assets_inserted }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Assets Updated**: ${{ steps.sync.outputs.assets_updated }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Assets Rejected**: ${{ steps.sync.outputs.assets_rejected }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎯 **All assets have been successfully synced to D1 database**" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Sync Status" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Please check the logs for details" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "_Autonomous pipeline - No file commits required_" >> $GITHUB_STEP_SUMMARY
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🔔 NOTIFICATION SYSTEM
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🔔 Send Success Notification
        if: steps.sync.outputs.sync_status == 'success' && (github.event.inputs.enable_notifications == 'true' || github.event_name == 'schedule')
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          # Only send if webhook is configured
          if [ -n "$WEBHOOK_URL" ]; then
            echo "🔔 Sending success notification..."
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"success\",
                \"message\": \"✅ Neural Bridge Sync Complete\",
                \"assets_discovered\": ${{ steps.transform.outputs.asset_count }},
                \"assets_inserted\": ${{ steps.sync.outputs.assets_inserted }},
                \"assets_updated\": ${{ steps.sync.outputs.assets_updated }},
                \"scan_type\": \"${{ github.event.inputs.scan_type || 'scheduled' }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
              }" && echo "✅ Notification sent" || echo "⚠️ Notification failed (non-critical)"
          else
            echo "ℹ️ No webhook configured - skipping notification"
          fi
      
      - name: 🔔 Send Failure Notification
        if: failure() && (github.event.inputs.enable_notifications == 'true' || github.event_name == 'schedule')
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK }}
        run: |
          # Only send if webhook is configured
          if [ -n "$WEBHOOK_URL" ]; then
            echo "🔔 Sending failure notification..."
            curl -s -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{
                \"status\": \"failure\",
                \"message\": \"❌ Neural Bridge Sync Failed\",
                \"scan_type\": \"${{ github.event.inputs.scan_type || 'scheduled' }}\",
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
                \"workflow_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }" && echo "✅ Notification sent" || echo "⚠️ Notification failed (non-critical)"
          else
            echo "ℹ️ No webhook configured - skipping notification"
          fi
      
      # ═══════════════════════════════════════════════════════════════════════
      # 🧹 CLEANUP
      # ═══════════════════════════════════════════════════════════════════════
      
      - name: 🧹 Cleanup Temporary Files
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          rm -f scan_results.txt payload.json parser_output.txt parse_results.py
          echo "✅ Cleanup complete - No files committed to repository"

# ═══════════════════════════════════════════════════════════════════════════════
# 📝 WORKFLOW NOTES
# ═══════════════════════════════════════════════════════════════════════════════
#
# Required GitHub Secrets:
# 1. WORKER_URL - Full URL to your Cloudflare Worker (e.g., https://your-worker.your-domain.workers.dev)
# 2. BRIDGE_SECRET - Strong secret key (min 32 characters, use: openssl rand -base64 32)
# 3. NOTIFICATION_WEBHOOK - (Optional) Webhook URL for notifications (e.g., Telegram bot)
#
# Environment Variables in Cloudflare Worker:
# 1. BRIDGE_SECRET - Must match GitHub secret (set as Secret, not Variable)
#
# Workflow Features:
# ✅ Zero file commits - Direct D1 injection
# ✅ Intelligent retry logic with exponential backoff
# ✅ Enhanced operator detection (MCI, Irancell, Rightel)
# ✅ Health checks after sync
# ✅ Comprehensive error handling
# ✅ Detailed workflow summaries
# ✅ Smart notification system (success/failure)
# ✅ Manual notification control via workflow_dispatch
# ✅ Automatic notifications for scheduled runs
#
# Improvements in this version:
# 🔧 Fixed: secrets handling in conditional statements
# 🧠 Enhanced: operator detection algorithm
# 📊 Improved: error reporting and logging
# 🔔 Smart: notification system with fallback
# 🎯 Optimized: retry logic and timeouts
#
# ═══════════════════════════════════════════════════════════════════════════════
